<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NSO orbit app icon</title>
  <desc id="desc">A bold crimson N surrounded by the NSO orbital ring, with a small shopping cart accent.</desc>
  <defs>
    <radialGradient id="blue" cx=".3" cy=".22" r=".92">
      <stop stop-color="#485eff"/><stop offset=".5" stop-color="#2639d9"/><stop offset="1" stop-color="#111b68"/>
    </radialGradient>
    <linearGradient id="red" x1=".12" y1=".92" x2=".88" y2=".08">
      <stop stop-color="#E11D48"/><stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#aab0b9"/><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#d8dce1"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#090f45" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#blue)"/>
  <rect x="20" y="20" width="984" height="984" rx="210" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
  <!-- Same central N and orbital identity as the NSO logo -->
  <ellipse cx="512" cy="498" rx="344" ry="228" transform="rotate(-34 512 498)"
    fill="none" stroke="#8da0ff" stroke-width="40" opacity=".34"/>
  <ellipse cx="512" cy="498" rx="344" ry="228" transform="rotate(-34 512 498)"
    fill="none" stroke="url(#silver)" stroke-width="18" stroke-dasharray="1325 835"
    stroke-dashoffset="170" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M337 690V310L687 690V310" fill="none" stroke="#8f102e" stroke-width="112"
    stroke-linecap="square" stroke-linejoin="bevel" opacity=".34" transform="translate(0 12)"/>
  <path d="M337 690V310L687 690V310" fill="none" stroke="url(#red)" stroke-width="104"
    stroke-linecap="square" stroke-linejoin="bevel" filter="url(#shadow)"/>
  <!-- Small but distinct cart cue, tucked at the lower right of the N -->
  <g transform="translate(0 4)" stroke-linecap="round" stroke-linejoin="round">
    <path d="m634 643 17 75h104l23-67h-117" fill="none" stroke="#111b68" stroke-width="23"/>
    <path d="m632 640 17 75h104l23-67h-117" fill="none" stroke="#fff" stroke-width="16"/>
    <path d="M619 625h17l8 34h116" fill="none" stroke="#fff" stroke-width="15"/>
    <circle cx="673" cy="741" r="11" fill="url(#red)" stroke="#fff" stroke-width="6"/>
    <circle cx="733" cy="741" r="11" fill="url(#red)" stroke="#fff" stroke-width="6"/>
  </g>
  <!-- Orbital speed marker -->
  <path d="m789 282 72-35-34 73-13-25-25-13Z" fill="#fff"/>
</svg>
